  body { font-family: 'Instrument Sans', 'Nunito', system-ui, sans-serif; color: #2a1236; }

  /* the circuit band: Pollen's second circuit board photo (images/texture/circuit-photo2.jpg: her photo cropped and mirrored side to side so it runs wide), a neon sign hung on two wires, die-cut stickers stuck on */
  .pcb { position: relative; isolation: isolate; overflow: hidden; min-height: clamp(380px, 52vw, 520px); display: grid; place-items: center;
    background: #7a1f6c url("images/texture/circuit-photo2.jpg") center / cover no-repeat; border-block: 3px solid #1a1420; padding: 70px 20px 60px; }
  .pcb::after { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse at 50% 55%, rgb(20 8 30 / .0) 30%, rgb(20 8 30 / .38) 100%); pointer-events: none; }
  .sign { position: relative; width: min(100%, 360px); box-sizing: border-box; padding: 26px 22px 22px; text-align: center; background: #141018; color: #fff8f1; border-radius: 24px;
    border: 3px solid #1a1420; box-shadow: 8px 8px 0 #f5967a, inset 0 0 0 5px #141018, inset 0 0 0 7px #cfd3ff, inset 0 0 14px 7px rgb(160 170 255 / .45), 0 0 34px rgb(160 170 255 / .35);
    transform: rotate(-1.4deg); }
  .sign::before { content: ""; position: absolute; bottom: calc(100% + 2px); left: 14%; right: 14%; height: 520px; border-inline: 3px dashed #fff8f1; filter: drop-shadow(0 0 1px #1a1420) drop-shadow(1px 1px 0 #1a1420); pointer-events: none; }
  .sign .s1 { display: block; font: 400 clamp(30px, 6vw, 40px)/1 'Manufacturing Consent', system-ui, sans-serif; color: #fff2a8; text-shadow: 0 0 6px #fff2a8, 0 0 16px #ffd37a, 0 0 30px #ffb48a; }
  .sign .s2 { display: block; margin: 6px 0 10px; font: 400 clamp(76px, 15vw, 104px)/.95 'Manufacturing Consent', system-ui, sans-serif; color: #fbd6e8; text-shadow: 0 0 4px #ffb4d8, 0 0 14px #f7a9b4, 0 0 32px #f5967a, 0 0 56px #f5967a; }
  .sign .s3 { display: block; font: 700 11.5px/1.5 'Silkscreen', ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: #fff8f1; }
  .sign .s3 .lbl { display: block; margin-bottom: 4px; }
  .sign .s3 a { color: #f7c6e8; text-decoration: none; border-bottom: 2px solid #f5967a; padding: 12px 0 2px; }
  .sign .s3 a:hover { color: #fff; }
  .sign .s3 a:focus-visible { outline: 3px solid #ffd37a; outline-offset: 4px; }
  .stk { position: absolute; width: clamp(54px, 8vw, 86px); aspect-ratio: 1; background: center / contain no-repeat; background-image: var(--img); pointer-events: none; z-index: 1;
    filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(3px 4px 0 rgb(42 31 92 / .4)); }
  /* an iridescent shine on every sticker: a rainbow sheen, cut to the sticker's own shape, that slowly sweeps across it */
  .stk::after { content: ""; position: absolute; inset: 0; pointer-events: none; -webkit-mask: var(--img) center / contain no-repeat; mask: var(--img) center / contain no-repeat;
    background: linear-gradient(115deg, rgb(255 255 255 / 0) 14%, rgb(255 143 208 / .38) 28%, rgb(255 243 168 / .42) 40%, rgb(143 240 255 / .42) 52%, rgb(183 154 255 / .4) 64%, rgb(255 143 208 / .36) 76%, rgb(255 255 255 / 0) 88%) 0% 0% / 260% 100%;
    opacity: 1; }
  .stk::before { content: ""; position: absolute; inset: 0; pointer-events: none; -webkit-mask: var(--img) center / contain no-repeat; mask: var(--img) center / contain no-repeat;
    background: linear-gradient(115deg, rgb(255 255 255 / 0) 38%, rgb(255 255 255 / .55) 47%, rgb(255 255 255 / 0) 56%) 0% 0% / 260% 100%; }
  @media (prefers-reduced-motion: no-preference) { .stk::after, .stk::before { animation: shine 5.5s ease-in-out infinite; } .stk:nth-of-type(2n)::after, .stk:nth-of-type(2n)::before { animation-delay: -2.2s; } .stk:nth-of-type(3n)::after, .stk:nth-of-type(3n)::before { animation-delay: -4s; }
    @keyframes shine { 0%, 100% { background-position: 0% 0%; } 50% { background-position: 100% 0%; } } }
  @media (max-width: 640px) { .stk.hide-s { display: none; } .sign { width: min(100%, 320px); } }
  @media (prefers-reduced-motion: no-preference) { .sign { animation: sway 7s ease-in-out infinite; transform-origin: 50% -140px; } @keyframes sway { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.2deg); } } }
