<!doctype html><meta charset="utf-8"><title>Services</title><meta http-equiv="refresh" content="0; url=../services/"><link rel="canonical" href="../services/"><a href="../services/">Services</a><dialog class="bk-modal" id="bk-modal" aria-label="Booking"><button type="button" class="bk-x" aria-label="Close">&times;</button><iframe title="Booking" src="about:blank"></iframe></dialog>
<script>(function(){var d=document.getElementById("bk-modal");if(!d||!d.showModal)return;var fr=d.querySelector("iframe");
function isBk(a){var h=a.getAttribute("href")||"";return /^https?:\/\/([a-z0-9-]+\.)?(acuityscheduling\.com|as\.me)\//i.test(h);}
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a");if(!a||!isBk(a)||e.metaKey||e.ctrlKey||e.shiftKey)return;e.preventDefault();fr.src=a.href;d.showModal();});
d.querySelector(".bk-x").addEventListener("click",function(){d.close();});
d.addEventListener("click",function(e){if(e.target===d)d.close();});
d.addEventListener("close",function(){fr.src="about:blank";});})();</script>
