<!doctype html><meta charset="utf-8"><title>Services</title><meta http-equiv="refresh" content="0; url=../services/"><link rel="canonical" href="../services/"><a href="../services/">Services</a><script>(function(){var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var io=("IntersectionObserver" in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:.12,rootMargin:"0px 0px -6% 0px"}):null;
document.querySelectorAll(".rv").forEach(function(el){if(io&&!rm)io.observe(el);else el.classList.add("in");});
var bands=[].slice.call(document.querySelectorAll(".band")),aw=document.getElementById("award"),tick=false;
function frame(){tick=false;var vh=innerHeight,y=scrollY;
bands.forEach(function(b){var r=b.getBoundingClientRect();if(r.bottom<0||r.top>vh)return;var p=(r.top+r.height/2-vh/2)/vh;b.firstElementChild.style.setProperty("--py",(-p*70).toFixed(1)+"px");});
if(aw){aw.classList.toggle("on",y>260);if(!rm){aw.style.transform="translateY("+(Math.sin(y/260)*10).toFixed(1)+"px) rotate("+(Math.sin(y/210)*9).toFixed(1)+"deg)";}}}
function req(){if(!tick){tick=true;requestAnimationFrame(frame);}}
addEventListener("scroll",req,{passive:true});addEventListener("resize",req);frame();})();</script>

<script>(function(){var d=document.getElementById("bk-modal");if(!d||!d.showModal)return;var fr=d.querySelector("iframe");
function isBk(a){var h=a.getAttribute("href")||"";return /^https?:\/\/([a-z0-9-]+\.)?(acuityscheduling\.com|as\.me)\//i.test(h);}
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a");if(!a||!isBk(a)||e.metaKey||e.ctrlKey||e.shiftKey)return;e.preventDefault();fr.src=a.href;d.showModal();});
d.querySelector(".bk-x").addEventListener("click",function(){d.close();});
d.addEventListener("click",function(e){if(e.target===d)d.close();});
d.addEventListener("close",function(){fr.src="about:blank";});})();</script>
